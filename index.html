<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마루</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--ink:#1F2540;--paper:#F4F5FA;--lemon:#FFD84D;--line:#DADDEB;--mute:#6B7191}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.hide{display:none!important}
#auth{max-width:380px;margin:0 auto;padding:12vh 20px}
h1{font-size:2rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.field{display:block;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
.btn{width:100%;padding:13px;background:var(--ink);color:#fff;font-weight:700}
.link{width:100%;padding:12px;background:none;color:var(--mute);text-decoration:underline}
.err{color:#b3261e;min-height:1.4em;font-size:.9rem;margin:6px 0}
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:280px 1fr}
aside{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.top b{font-size:1.2rem;font-weight:800}
.sm{padding:6px 10px;background:var(--paper);font-size:.85rem}
#rooms{flex:1;overflow-y:auto;padding:8px}
.room{display:block;width:100%;text-align:left;padding:12px;background:none;font-weight:600}
.room.on{background:var(--paper)}
.acts{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.acts button{flex:1;padding:10px;background:var(--ink);color:#fff;font-weight:600}
.acts button+button{background:var(--paper);color:var(--ink)}
.note{color:var(--mute);padding:12px}
main{display:flex;flex-direction:column;min-height:0;min-width:0}
#ph{margin:auto;color:var(--mute)}
#chat{display:flex;flex-direction:column;flex:1;min-height:0}
.head{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--ink);color:#fff}
.head h2{flex:1;margin:0;font-size:1.05rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.head button{background:rgba(255,255,255,.14);color:#fff;padding:6px 10px;font-size:.85rem}
.back{display:none;font-size:1.2rem!important}
#msgs{flex:1;overflow-y:auto;padding:8px 0}
.day{text-align:center;color:var(--mute);font-size:.8rem;margin:14px 0 6px}
.who{font-size:.8rem;color:var(--mute);margin:8px 12px 2px 52px}
.row{display:flex;align-items:flex-end;gap:8px;padding:2px 12px}
.row.me{flex-direction:row-reverse}
.av{width:32px;height:32px;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.bub{max-width:75%;padding:8px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.me .bub{background:var(--ink);border-color:var(--ink);color:#fff}
.time{font-size:.7rem;color:var(--mute);flex:none}
.empty{text-align:center;color:var(--mute);margin-top:30px}
.new{animation:up .18s ease-out}
@keyframes up{from{transform:translateY(8px);opacity:0}}
@media(prefers-reduced-motion:reduce){.new{animation:none}}
#sendForm{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff}
#text{flex:1;resize:none;max-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
#sendForm button{width:44px;height:44px;background:var(--lemon);color:var(--ink);font-size:1.2rem;font-weight:800}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:.9rem;max-width:90%}
@media(max-width:799px){
 #app{grid-template-columns:1fr}
 #app[data-view=list] main{display:none}
 #app[data-view=chat] aside{display:none}
 .back{display:inline-block}
}
</style>
</head>
<body>
<section id="auth" class="hide">
  <h1>마루</h1>
  <p class="sub">우리끼리만 쓰는 작은 대화방</p>
  <form id="authForm">
    <input class="field" id="email" type="email" placeholder="이메일" autocomplete="email" required>
    <input class="field" id="pw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" minlength="6" required>
    <input class="field hide" id="nick" type="text" placeholder="닉네임 (12자 이내)" maxlength="12">
    <p class="err" id="authMsg" role="alert"></p>
    <button class="btn" id="authBtn" type="submit">로그인</button>
    <button class="link" id="toggle" type="button">처음이라면 가입하기</button>
  </form>
</section>

<div id="app" class="hide" data-view="list">
  <aside>
    <div class="top"><b>마루</b><button class="sm" id="logout">로그아웃</button></div>
    <div id="rooms"></div>
    <div class="acts"><button id="newRoom">새 방</button><button id="joinRoom">코드로 입장</button></div>
  </aside>
  <main>
    <p id="ph">왼쪽에서 방을 고르거나 새로 만들어 보세요.</p>
    <section id="chat" class="hide">
      <div class="head">
        <button class="back" id="back" aria-label="방 목록">‹</button>
        <h2 id="title"></h2>
        <button id="invite">초대 코드</button>
      </div>
      <div id="msgs"></div>
      <form id="sendForm">
        <textarea id="text" rows="1" placeholder="메시지 보내기" aria-label="메시지"></textarea>
        <button type="submit" aria-label="보내기">↑</button>
      </form>
    </section>
  </main>
</div>
<div id="toast" class="hide" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===== Supabase 연결 정보 (다른 프로젝트를 쓰면 이 두 줄을 바꾸세요) =====
const SUPABASE_URL = 'https://iorgunigdmkseookjegc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_A4pM2sB4eMqHnGOSmsV0zw_9TQgY_JU';
// ====================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const COLORS = ['#F2735B', '#3CC9A0', '#5BB4F0', '#A35BD6', '#F0A53A', '#9BCB3F'];
const SHAPES = [
  { r: '50%' }, { r: '8px' },
  { c: 'polygon(50% 0,100% 50%,50% 100%,0 50%)' },
  { c: 'polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)' },
  { r: '35%' },
  { c: 'polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)' }
];
let me = null, profiles = {}, rooms = [], room = null, chan = null, last = null, seen = new Set(), mode = 'login';

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.classList.remove('hide');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.add('hide'), 2600);
}
function avatar(uid) {
  const p = profiles[uid] || { nickname: '?', color: 0 };
  const a = el('div', 'av', [...p.nickname][0] || '?');
  a.style.background = COLORS[p.color];
  const s = SHAPES[p.color];
  if (s.r) a.style.borderRadius = s.r;
  if (s.c) a.style.clipPath = s.c;
  return a;
}

/* ---------- 로그인 / 가입 ---------- */
$('toggle').onclick = () => {
  mode = mode === 'login' ? 'signup' : 'login';
  const su = mode === 'signup';
  $('nick').classList.toggle('hide', !su);
  $('nick').required = su;
  $('authBtn').textContent = su ? '가입하기' : '로그인';
  $('toggle').textContent = su ? '이미 계정이 있어요' : '처음이라면 가입하기';
  $('pw').autocomplete = su ? 'new-password' : 'current-password';
  $('authMsg').textContent = '';
};
$('authForm').onsubmit = async e => {
  e.preventDefault();
  const msg = $('authMsg');
  msg.textContent = '';
  const email = $('email').value.trim(), password = $('pw').value, nick = $('nick').value.trim();
  let r;
  if (mode === 'signup') {
    if (!nick) { msg.textContent = '닉네임을 입력해 주세요.'; return; }
    r = await sb.auth.signUp({ email, password, options: { data: { nickname: nick } } });
    if (!r.error && !r.data.session) { msg.textContent = '확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.'; return; }
  } else {
    r = await sb.auth.signInWithPassword({ email, password });
  }
  if (r.error) msg.textContent = mode === 'signup' ? '가입하지 못했어요: ' + r.error.message : '로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.';
};
$('logout').onclick = () => sb.auth.signOut();

// 로그인 상태가 바뀔 때마다 실행 (페이지를 열 때도 한 번 실행돼요)
sb.auth.onAuthStateChange((_ev, s) => {
  if (s && s.user) {
    if (!me || me.id !== s.user.id) { me = s.user; setTimeout(start, 0); }
  } else {
    me = null; setTimeout(stop, 0);
  }
});
async function start() {
  $('auth').classList.add('hide');
  $('app').classList.remove('hide');
  await loadProfiles();
  await loadRooms();
}
function stop() {
  leave(); room = null; rooms = [];
  $('app').classList.add('hide');
  $('auth').classList.remove('hide');
}

/* ---------- 방 ---------- */
async function loadProfiles() {
  const { data } = await sb.from('profiles').select('id,nickname,color');
  (data || []).forEach(p => profiles[p.id] = p);
}
async function loadRooms() {
  const { data } = await sb.from('room_members').select('rooms(id,name,invite_code)').eq('user_id', me.id);
  rooms = (data || []).map(x => x.rooms).filter(Boolean);
  renderRooms();
}
function renderRooms() {
  const box = $('rooms');
  box.textContent = '';
  if (!rooms.length) box.append(el('p', 'note', '아직 방이 없어요. 새로 만들거나 초대 코드로 들어가 보세요.'));
  rooms.forEach(r => {
    const b = el('button', 'room' + (room && room.id === r.id ? ' on' : ''), r.name);
    b.onclick = () => open(r.id);
    box.append(b);
  });
}
$('newRoom').onclick = async () => {
  const n = (prompt('방 이름 (20자 이내)') || '').trim().slice(0, 20);
  if (!n) return;
  const { data, error } = await sb.rpc('create_room', { room_name: n });
  if (error) return toast('방을 만들지 못했어요.');
  await loadRooms(); open(data.id);
};
$('joinRoom').onclick = async () => {
  const c = (prompt('초대 코드를 입력하세요') || '').trim();
  if (!c) return;
  const { data, error } = await sb.rpc('join_room', { code: c });
  if (error) return toast('코드가 맞지 않아요. 보낸 사람에게 다시 확인해 보세요.');
  await loadProfiles(); await loadRooms(); open(data.id);
};
$('invite').onclick = () => {
  if (!room) return;
  navigator.clipboard.writeText(room.invite_code).then(
    () => toast('초대 코드를 복사했어요: ' + room.invite_code),
    () => prompt('초대 코드', room.invite_code));
};
$('back').onclick = () => { $('app').dataset.view = 'list'; };

/* ---------- 대화 ---------- */
function leave() { if (chan) { sb.removeChannel(chan); chan = null; } }
function scroll() { const b = $('msgs'); b.scrollTop = b.scrollHeight; }

async function open(id) {
  leave();
  room = rooms.find(r => r.id === id);
  if (!room) return;
  renderRooms();
  $('app').dataset.view = 'chat';
  $('ph').classList.add('hide');
  $('chat').classList.remove('hide');
  $('title').textContent = room.name;
  $('msgs').textContent = '';
  last = null; seen = new Set();
  const { data } = await sb.from('messages').select('id,user_id,body,created_at')
    .eq('room_id', id).order('created_at', { ascending: false }).limit(100);
  const list = (data || []).reverse();
  if (!list.length) $('msgs').append(el('p', 'empty', '아직 대화가 없어요. 첫 메시지를 보내 보세요.'));
  list.forEach(m => add(m, false));
  scroll();
  chan = sb.channel('room-' + id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: 'room_id=eq.' + id }, async p => {
      if (!profiles[p.new.user_id]) await loadProfiles();
      const b = $('msgs'), near = b.scrollHeight - b.scrollTop - b.clientHeight < 150;
      add(p.new, true);
      if (near || p.new.user_id === me.id) scroll();
    }).subscribe();
}

function add(m, anim) {
  if (seen.has(m.id)) return;
  seen.add(m.id);
  const box = $('msgs'), emp = box.querySelector('.empty');
  if (emp) emp.remove();
  const d = new Date(m.created_at), mine = m.user_id === me.id;
  const ld = last && new Date(last.created_at);
  const newDay = !ld || ld.toDateString() !== d.toDateString();
  if (newDay) box.append(el('div', 'day', d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' })));
  const first = newDay || last.user_id !== m.user_id || d - ld > 300000;
  if (first && !mine) box.append(el('div', 'who', (profiles[m.user_id] || {}).nickname || '알 수 없음'));
  const row = el('div', 'row' + (mine ? ' me' : '') + (anim ? ' new' : ''));
  if (!mine) {
    const a = avatar(m.user_id);
    if (!first) a.style.visibility = 'hidden';
    row.append(a);
  }
  row.append(el('div', 'bub', m.body),
    el('span', 'time', d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false })));
  box.append(row);
  last = m;
}

async function send() {
  const t = $('text'), body = t.value.trim();
  if (!body || !room) return;
  t.value = ''; grow();
  const { data, error } = await sb.from('messages').insert({ room_id: room.id, body })
    .select('id,user_id,body,created_at').single();
  if (error) { t.value = body; grow(); return toast('보내지 못했어요. 다시 보내 주세요.'); }
  add(data, true); scroll();
}
function grow() {
  const t = $('text');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 120) + 'px';
}
$('sendForm').onsubmit = e => { e.preventDefault(); send(); };
$('text').oninput = grow;
$('text').onkeydown = e => {
  // 한글 입력 중(isComposing)에는 Enter를 무시해서 마지막 글자가 중복 전송되지 않게 해요
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
};
</script>
</body>
</html>
